<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计稿 v2 · 7 复习模式（标记模式）</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <!-- 全局顶栏：顶栏常驻「↺ 重置」+ 轮次徽标 -->
  <header class="app-header" id="app-header">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="2" y="2" width="28" height="28" rx="9" fill="#2E9E78"/>
          <path d="M16 7 C16 7 9 16 9 21 A7 7 0 0 0 23 21 C23 16 16 7 16 7 Z" fill="#fff"/>
        </svg>
      </span>
      <span class="brand-name">高频词小灶</span>
    </div>
    <div class="header-right">
      <button class="btn btn-reset" type="button">↺ 重置</button>
      <div class="round-badge">第 3 轮 · 已学 60 词</div>
    </div>
  </header>

  <main class="app-main">
    <section class="view view-study view-active" id="view-review">
      <div class="view-title-row">
        <h2 class="view-title" id="review-title">标记模式 · 第 1 / 1 轮</h2>
        <!-- 「标记」处于开启状态（深绿激活态），再点一次回到「复习模式」 -->
        <div class="view-title-actions">
          <button class="btn btn-review-toggle" type="button">学习</button>
          <button class="btn btn-review-toggle active" type="button" aria-pressed="true" title="再点一次回到全部复习（当前只看 英文模式标记过的 3 个词）">标记</button>
        </div>
      </div>

      <!-- 复习 / 标记模式：切换器仅保留中文 / 英文（「背单词」段由 CSS 隐藏） -->
      <div class="mode-switcher" data-view="review">
        <button class="mode-btn" data-mode="learn">背单词</button>
        <button class="mode-btn active" data-mode="en">英文模式</button>
        <button class="mode-btn" data-mode="zh">中文模式</button>
      </div>

      <div class="flashcard-area">
        <button class="nav nav-left" aria-label="上一个">‹</button>

        <div class="flashcard" data-mode="en">
          <button class="card-mark marked" type="button" aria-pressed="true" aria-label="取消标记" title="取消标记">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
            </svg>
          </button>
          <button class="card-speaker" aria-label="发音预留" title="发音功能开发中">🔈</button>
          <div class="card-word">concept</div>
          <div class="card-phonetic">/ˈkɒnsept/</div>
          <div class="card-meaning">概念；观念</div>
          <div class="answer-row">
            <button class="btn btn-outline btn-show-answer">显示中文释义</button>
          </div>
          <div class="write-row">
            <input type="text" class="write-input" placeholder="在此输入英文单词…" autocomplete="off" />
            <button class="btn btn-outline btn-show-answer">显示英文单词</button>
          </div>
        </div>

        <button class="nav nav-right" aria-label="下一个">›</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width: 50%"></div></div>
        <div class="progress-text">2 / 3</div>
        <div class="progress-hint">只看英文模式标记过的单词 · 共 3 个</div>
      </div>

      <!-- 标记模式同样按 20 个一批；本例只有 3 个词，故上一轮 / 下一轮都处于禁用态 -->
      <div class="action-bar">
        <button class="btn btn-secondary" disabled>
          <span class="btn-icon">↺</span> 上一轮
        </button>
        <button class="btn btn-secondary" disabled>
          <span class="btn-icon">↻</span> 下一轮
        </button>
      </div>

      <!-- 复习 / 标记模式不展示故事面板（由 CSS 隐藏），保留结构以对齐真实 DOM -->
      <article class="story-panel">
        <h3 class="story-title">今日小故事 · 中英对照</h3>
        <p class="story-subtitle">用刚才这 20 个词写成，英文约 120 词，附中文对照</p>
        <p class="story-en"></p>
        <p class="story-zh"></p>
        <p class="story-footer">已尽量包含全部 20 个词；个别难组合的词已省略。</p>
      </article>
    </section>
  </main>

  <!-- 设计稿说明：静态高保真稿，样式与真实应用共用 ../style.css，不接交互逻辑 -->
</body>
</html>

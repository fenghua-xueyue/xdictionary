<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计稿 v2 · 1 初始空状态</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="app-main">
    <!-- 第一界面：初始空状态 -->
    <section class="view view-empty view-active" id="view-empty">
      <div class="hero">
        <div class="hero-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="64" height="64">
            <rect x="4" y="4" width="56" height="56" rx="18" fill="#2E9E78"/>
            <path d="M32 16 C32 16 20 32 20 40 A12 12 0 0 0 44 40 C44 32 32 16 32 16 Z" fill="#fff"/>
          </svg>
        </div>
        <h1 class="hero-title">每天 20 个四级高频词，<br/>用一个故事串起来。</h1>
        <p class="hero-subtitle">随机抽词 · 跨轮不重复 · 用词生成中英对照小故事</p>
        <button class="btn btn-primary btn-hero" id="btn-start">
          <span class="btn-icon">→</span> 开始背单词
        </button>
        <p class="hero-footer">词库 300 词 · 学完一轮自动循环</p>
      </div>
    </section>
  </main>

  <!-- 设计稿说明：静态高保真稿，样式与真实应用共用 ../style.css，不接交互逻辑 -->
</body>
</html>

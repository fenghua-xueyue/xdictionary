  <script src="words.js?v=202610263"></script>
  <script>
    /* 首屏：仅负责进入学习页，不再抽新一轮。
       若尚无进度，study.html 的 init() 会自动抽第 1 轮；
       已有进度则直接回到当前学习轮，避免点一下就跳到下一轮。
       按钮文案随进度变化：无进度「开始背单词」/ 有进度「继续学习」，
       并显示足迹行（第 N 轮 · 已学 M 词，口径与 app.js 一致 = 轮数 × 20）。
       另有「活词预览」：每 2.5s 从词库抽一个词翻面展示（纯演示）。 */
    (function () {
      "use strict";
      var LS_KEY = "english_app_v1";
      var btn = document.getElementById("btn-start");
      if (!btn) return;

      // 已有学习进度 → 文案改为「继续学习」（保留箭头图标）+ 足迹行
      try {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) {
          var d = JSON.parse(raw);
          if (d && d.currentRound) {
          var icon = btn.querySelector(".btn-icon");
          /* 逐个移除子节点而非 textContent=""：后者会把 SVG 内部的 <use>/path 一并清空，图标就没了 */
          while (btn.firstChild) btn.removeChild(btn.firstChild);
          if (icon) btn.appendChild(icon);
          btn.appendChild(document.createTextNode(" 继续学习"));
          var prog = document.getElementById("hero-progress");
          if (prog) {
            prog.hidden = false;
            prog.textContent = "第 " + d.currentRound.round + " 轮 · 已学 " + (d.currentRound.round * 20) + " 词";
          }
          }
        }
      } catch (e) {}

      // —— 活词预览：随机抽词翻面（纯展示；读屏跳过；页签隐藏时暂停） ——
      var WORDS = window.WORDS || [];
      var reduce = false;
      try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { /* 保守当 false */ }
      var pWord = document.getElementById("preview-word");
      var pMean = document.getElementById("preview-meaning");
      var pInner = document.getElementById("preview-inner");
      if (pWord && pMean && pInner && WORDS.length) {
        var lastIdx = -1;
        var fillPreview = function () {
          var i;
          do { i = Math.floor(Math.random() * WORDS.length); } while (i === lastIdx && WORDS.length > 1);
          lastIdx = i;
          var w = WORDS[i];
          pWord.textContent = w.word;
          pMean.textContent = w.meaning + (w.phonetic ? " · " + w.phonetic : "");
        };
        fillPreview();
        setInterval(function () {
          if (document.hidden) return;
          if (reduce) { fillPreview(); return; }   // 减动效：只换字不翻面
          pInner.classList.add("is-flipping");
          setTimeout(function () {
            fillPreview();
            pInner.classList.remove("is-flipping");
          }, 240);
        }, 2500);
      }

      btn.addEventListener("click", function () {
        window.location.href = "study.html";
      });
    })();
  </script>
